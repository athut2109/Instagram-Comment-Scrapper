name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          echo "Repository contents (root):"
          ls -la
          echo "Recursive listing:"
          ls -R
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            echo "Found requirements.txt — installing"
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            echo "Found pyproject.toml — installing package"
            pip install .
          elif [ -f setup.py ]; then
            echo "Found setup.py — installing package"
            pip install .
          else
            echo "No requirements.txt, pyproject.toml, or setup.py found. Exiting with error."
            exit 1
          fi
      - name: Initialize DB
        run: python scripts/init_db.py

      - name: Wait for Redis
        run: |
          python - <<'PY'
          import time
          import redis
          url = 'redis://localhost:6379'
          for i in range(15):
              try:
                  r = redis.from_url(url)
                  r.ping()
                  print('redis is up')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Redis did not start')
          PY

      - name: Run tests
        run: pytest -q
